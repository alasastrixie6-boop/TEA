<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact - Tea Heaven</title><link rel="stylesheet" href="css/style.css"></head><body>
<header class="site-header"><div class="container nav-wrap"><div class="brand">Tea Heaven Order</div><button class="nav-toggle">&#9776;</button><nav class="nav-links"><a href="index.html">Home</a><a href="menu.html">Menu & Order</a><a href="queue.html">Queue Status</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav></div></header>
<main><div class="container">
<h1>Contact</h1>
<form id="contactForm">
  <div class="form-group"><label>Name</label><input id="cName"><p class="error" id="cNameErr"></p></div>
  <div class="form-group"><label>Email</label><input id="cEmail"><p class="error" id="cEmailErr"></p></div>
  <div class="form-group"><label>Message</label><textarea id="cMsg"></textarea><p class="error" id="cMsgErr"></p></div>
  <button class="btn" type="submit">Send</button>
  <p class="success" id="cSuccess"></p>
</form>
<h2>Cafe Info</h2>
<p>Address: 123 Tea Street (placeholder)</p>
<p>Hours: 9am–9pm daily (placeholder)</p>
<p>Social: @teaheaven (placeholder)</p>
</div></main>
<footer>&copy; 2026 Tea Heaven Order</footer>
<script src="js/main.js"></script>
<script>
document.getElementById('contactForm').addEventListener('submit',e=>{
  e.preventDefault();
  let ok=true;
  const name=document.getElementById('cName').value.trim();
  const email=document.getElementById('cEmail').value.trim();
  const msg=document.getElementById('cMsg').value.trim();
  document.getElementById('cNameErr').textContent = name?'':'Name required';
  if(!name) ok=false;
  document.getElementById('cEmailErr').textContent = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)?'':'Valid email required';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) ok=false;
  document.getElementById('cMsgErr').textContent = msg?'':'Message required';
  if(!msg) ok=false;
  if(ok){ document.getElementById('cSuccess').textContent='Message sent (demo).'; }
});
</script>
</body></html>
